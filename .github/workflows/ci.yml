name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # This repo's Actions policy allows GitHub-owned actions plus four named
      # patterns, and jdx/mise-action is not among them. So CI installs node
      # and pnpm directly. mise still drives local development; the guard below
      # stops the two from drifting.
      - name: Check mise.toml and .node-version agree
        run: |
          mise_node="$(sed -nE 's/^node = "(.*)"$/\1/p' mise.toml)"
          file_node="$(tr -d '[:space:]' < .node-version)"
          if [ "$mise_node" != "$file_node" ]; then
            echo "::error::mise.toml pins node $mise_node but .node-version says $file_node"
            exit 1
          fi
          echo "node $file_node, agreed by both files"

      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      # --frozen-lockfile makes CI fail on a lockfile that does not match
      # package.json, rather than quietly resolving something new.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run check:types

      - run: pnpm test

      - run: pnpm run build
