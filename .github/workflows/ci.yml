name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # mise installs the node and pnpm versions pinned in mise.toml, so CI and
      # a laptop resolve dependencies with the same tools.
      - uses: jdx/mise-action@v3
        with:
          version: 2026.8.3

      # --frozen-lockfile makes CI fail on a lockfile that does not match
      # package.json, rather than quietly resolving something new.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run check:types

      - run: pnpm test

      - run: pnpm run build
