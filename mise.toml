# Node and pnpm are pinned here because CI and a laptop must agree on them
# before any dependency is resolved. Wrangler is deliberately NOT pinned here:
# it is a devDependency, so pnpm already fixes its version in the lockfile, and
# a second source of truth would let the two drift.
[tools]
node = "22.23.1"
pnpm = "12.4.2"
